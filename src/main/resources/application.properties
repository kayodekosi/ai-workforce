spring.application.name=ai-workforce

# In-memory H2 so it runs with zero setup. Swap for PostgreSQL in production.
# File-based H2 at an ABSOLUTE path so it's unambiguous regardless of working dir.
# /app/data is mounted as a Docker volume (see docker-compose.yml) so data PERSISTS.
spring.datasource.url=jdbc:h2:file:/app/data/aiworkforce;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Silence the default Spring Security generated-password log; we use our own auth.
logging.level.org.springframework.security=WARN

server.port=8080

# --- JWT auth ---
# Override these in production with a long random secret.
app.jwt.secret=change-me-in-production-please-use-a-long-random-secret-string
app.jwt.expiry-minutes=120
spring.h2.console.settings.web-allow-others=true

# --- Voice / TTS (flexible, multi-provider) ---
# Leave the endpoint blank to use built-in simulation (clip URLs, no account needed).
# To use a REAL provider (ElevenLabs, Azure, Google, Polly, OpenAI, self-hosted),
# point the endpoint at its synth API (or a thin adapter) and set the key:
app.voice.http.endpoint=
app.voice.http.api-key=
app.voice.http.url-field=audio_url

# --- HR AI Interviewer ---
# Leave connector=NONE for built-in simulated scoring (no setup).
# To use a real AI backend for interview scoring, set connector to one of
# N8N / LANGFLOW / DIFY / FLOWISE / CUSTOM_WEBHOOK and provide its endpoint:
app.hr.interviewer.connector=NONE
app.hr.interviewer.endpoint=
app.hr.interviewer.model=

# --- Email ---
# SMTP is now configured in the portal: Settings -> Email / SMTP (with a Test button).
# Settings persist in the database; no properties needed here.

spring.application.name=ai-workforce

# In-memory H2 so it runs with zero setup. Swap for PostgreSQL in production.
spring.datasource.url=jdbc:h2:mem:aiworkforce;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Silence the default Spring Security generated-password log; we use our own auth.
logging.level.org.springframework.security=WARN

server.port=8080

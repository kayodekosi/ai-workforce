services:
  ai-workforce:
    build: .
    container_name: ai-workforce
    ports:
      # host:container — change the LEFT number to expose a different host port,
      # e.g. "9000:8080" serves the app on http://localhost:9000
      - "8080:8080"
    environment:
      # The port the app listens on INSIDE the container.
      # If you change this, update the container side of the port mapping above too.
      SERVER_PORT: 8080
    volumes:
      # Named volume (managed by Docker) — reliably persists the H2 database
      # across `docker compose up --build`, including on WSL where host bind-mounts
      # under /mnt/c can have permission quirks.
      - aiworkforce-data:/app/data
    restart: unless-stopped

  # ---- Optional: PostgreSQL for production instead of in-memory H2 ----
  # Uncomment this block and the datasource env vars to persist data.
  #
  # db:
  #   image: postgres:16
  #   environment:
  #     POSTGRES_DB: aiworkforce
  #     POSTGRES_USER: aiworkforce
  #     POSTGRES_PASSWORD: changeme
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #
  # then add to ai-workforce.environment:
  #   SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/aiworkforce
  #   SPRING_DATASOURCE_USERNAME: aiworkforce
  #   SPRING_DATASOURCE_PASSWORD: changeme
  #   SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect

volumes:
  aiworkforce-data:

